# 로컬 실행 정의 — 레포 루트의 compose.yaml 이 이 파일을 include 하므로 루트에서 `docker compose up` 한 번으로 모두 뜬다.
# 값은 iac/.env(gitignore)에서 덮어쓸 수 있다 — 이름은 iac/.env.example. 아래 기본값은 로컬 전용이다.
# 경로는 이 파일(iac/) 기준이다.
name: group-mission

services:
  redis:
    image: redis:8-alpine
    # NFR-5 재시작 내구성 — AOF everysec(최대 1초 유실, docs/hld/platform.md §4).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mission}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mission-local}
      POSTGRES_DB: ${POSTGRES_DB:-mission}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build:
      context: ../backend
      dockerfile: ../iac/docker/backend.Dockerfile
      target: api
    image: group-mission-api:local
    environment:
      REDIS_HOST: redis
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-mission}
      POSTGRES_USER: ${POSTGRES_USER:-mission}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mission-local}
      # JWT HS256 서명 키 — 로컬 전용 문구(32바이트 이상). 운영은 반드시 덮어쓴다(SPEC platform §2)
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-mission-local-jwt-secret-not-for-production}
      # 로컬은 http 라 쿠키 Secure 를 뺀다(앱 기본값은 true)
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  realtime:
    build:
      context: ../backend
      dockerfile: ../iac/docker/backend.Dockerfile
      target: realtime
    image: group-mission-realtime:local
    environment:
      REDIS_HOST: redis
      SERVER_PORT: 8081
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-mission}
      POSTGRES_USER: ${POSTGRES_USER:-mission}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mission-local}
    ports:
      - "${REALTIME_PORT:-8081}:8081"
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  web:
    build:
      context: ../frontend
      dockerfile: ../iac/docker/frontend.Dockerfile
      additional_contexts:
        nginx-conf: ./docker
    image: group-mission-web:local
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  postgres-data:
  redis-data:
