# 로컬 실행 정의 — 레포 루트의 compose.yaml 이 이 파일을 include 하므로 루트에서 `docker compose up` 한 번으로 모두 뜬다.
# 값은 iac/.env(gitignore)에서 덮어쓸 수 있다 — 이름은 iac/.env.example. 아래 기본값은 로컬 전용이다.
# 경로는 이 파일(iac/) 기준이다.
# 워크트리마다 앱 이미지 태그(IMAGE_TAG)와 프로젝트 이름(-p · COMPOSE_PROJECT_NAME)을 나눈다 — iac/local.sh 가 브랜치로 정한다(SPEC platform §5).
name: group-mission

services:
  redis:
    image: redis:8-alpine
    # NFR-5 재시작 내구성 — AOF everysec(최대 1초 유실, docs/hld/platform.md §4).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mission}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mission-local}
      POSTGRES_DB: ${POSTGRES_DB:-mission}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build:
      context: ../backend
      dockerfile: ../iac/docker/backend.Dockerfile
      target: api
    image: group-mission-api:${IMAGE_TAG:-local}
    environment:
      REDIS_HOST: redis
      # 시각 주입(game.clock-offset · SPEC platform §2) — 세 앱이 같은 값이어야 시각 · 키가 맞는다. 기본은 이동 없음
      GAME_CLOCKOFFSET: ${GAME_CLOCKOFFSET:-0s}
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-mission}
      POSTGRES_USER: ${POSTGRES_USER:-mission}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mission-local}
      # JWT HS256 서명 키 — 로컬 전용 문구(32바이트 이상). 운영은 반드시 덮어쓴다(SPEC platform §2)
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-mission-local-jwt-secret-not-for-production}
      # 로컬은 http 라 쿠키 Secure 를 뺀다(앱 기본값은 true)
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "${API_PORT:-8080}:8080"
    # 스키마 · 시드(spring.sql.init)를 다 적용해야 앱이 뜬다 — healthy = 스키마 준비됨. worker 가 이것을 기다린다(LLD platform §4.3)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  realtime:
    build:
      context: ../backend
      dockerfile: ../iac/docker/backend.Dockerfile
      target: realtime
    image: group-mission-realtime:${IMAGE_TAG:-local}
    environment:
      REDIS_HOST: redis
      # 시각 주입(game.clock-offset · SPEC platform §2) — 세 앱이 같은 값이어야 시각 · 키가 맞는다. 기본은 이동 없음
      GAME_CLOCKOFFSET: ${GAME_CLOCKOFFSET:-0s}
      SERVER_PORT: 8081
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-mission}
      POSTGRES_USER: ${POSTGRES_USER:-mission}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mission-local}
    ports:
      - "${REALTIME_PORT:-8081}:8081"
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # 웹 서버 없음(포트 없음) — 잡 · persister 소비 루프. 상태 확인은 컨테이너 running(SPEC platform §1)
  worker:
    build:
      context: ../backend
      dockerfile: ../iac/docker/backend.Dockerfile
      target: worker
    image: group-mission-worker:${IMAGE_TAG:-local}
    environment:
      REDIS_HOST: redis
      # 시각 주입(game.clock-offset · SPEC platform §2) — 세 앱이 같은 값이어야 시각 · 키가 맞는다. 기본은 이동 없음
      GAME_CLOCKOFFSET: ${GAME_CLOCKOFFSET:-0s}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-mission}
      POSTGRES_USER: ${POSTGRES_USER:-mission}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mission-local}
    # 스키마는 api 가 만든다 — 다 만든 뒤(api healthy)에 떠서 기동 파티션 DDL 이 schema.sql 과 겹치지 않는다(LLD platform §4.3 · SPEC §1).
    # 겹쳐도 advisory lock 이 차례를 세우므로 이것은 기동 순서일 뿐이다(api 여러 대 · compose 밖 배포는 잠금이 막는다)
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }

  web:
    build:
      context: ../frontend
      dockerfile: ../iac/docker/frontend.Dockerfile
      additional_contexts:
        nginx-conf: ./docker
    image: group-mission-web:${IMAGE_TAG:-local}
    ports:
      - "${WEB_PORT:-3000}:80"
    # nginx 가 api · realtime 이름을 풀 수 있게 기동 순서만 맞춘다(헬스 조건 아님 — web-client LLD §1.2).
    depends_on:
      - api
      - realtime

volumes:
  postgres-data:
  redis-data:
