spring:
  application:
    name: mission-api
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:mission}
    username: ${POSTGRES_USER:mission}
    password: ${POSTGRES_PASSWORD:mission-local}
  sql:
    init:
      # 기동 때 infra:rdb 의 schema.sql 적용(CREATE … IF NOT EXISTS — LLD platform §1)
      mode: always

auth:
  jwt-secret: ${AUTH_JWT_SECRET}
  cookie-secure: ${AUTH_COOKIE_SECURE:true}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
