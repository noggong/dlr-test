spring:
  application:
    name: mission-realtime
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # infra:rdb 를 함께 싣는다. 스키마 적용은 api 만 한다(spring.sql.init 기본값 — 내장 DB 가 아니면 하지 않음)
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:mission}
    username: ${POSTGRES_USER:mission}
    password: ${POSTGRES_PASSWORD:mission-local}

realtime:
  # 마지막 프레임 뒤 이만큼 아무것도 없으면 `: ping`(SPEC realtime-board RB9)
  heartbeat: 15s
  # 연결마다 그룹 채널 메시지 버퍼 칸 수 — 넘치면 가장 오래된 것을 버린다(LLD realtime-board §4.4)
  connection-buffer: 16

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
