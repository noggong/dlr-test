<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1500" height="1000" fill="#fff"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">운영 설계 구성도 (EKS)</text>
<text x="40" y="76" font-size="15" fill="#64748b">문서 설계 / 실제 클라우드 미사용</text>
<rect x="30" y="330" width="150" height="90" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="105.0" y="356" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">클라이언트</text>
<text x="105.0" y="378" font-size="13" text-anchor="middle" fill="#334155">앱 / 웹</text>
<rect x="30" y="520" width="150" height="80" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
<text x="105.0" y="546" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">CDN</text>
<text x="105.0" y="568" font-size="13" text-anchor="middle" fill="#334155">문제 본문 (정적)</text>
<rect x="220" y="100" width="1250" height="870" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 5"/>
<text x="240" y="126" font-size="14" fill="#64748b">EKS</text>
<rect x="240" y="330" width="120" height="90" rx="10" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="300.0" y="356" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">ALB</text>
<text x="300.0" y="378" font-size="13" text-anchor="middle" fill="#334155">경로 분배</text>
<text x="300.0" y="397" font-size="13" text-anchor="middle" fill="#334155">SSE 버퍼링 끔</text>
<rect x="420" y="150" width="240" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="540.0" y="176" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">api</text>
<text x="540.0" y="198" font-size="13" text-anchor="middle" fill="#334155">Deployment</text>
<text x="540.0" y="217" font-size="13" text-anchor="middle" fill="#334155">HPA (CPU, RPS)</text>
<text x="540.0" y="236" font-size="13" text-anchor="middle" fill="#334155">KEDA cron 06:40 확장</text>
<text x="540.0" y="255" font-size="13" text-anchor="middle" fill="#334155">single-flight + bulkhead</text>
<rect x="420" y="330" width="240" height="120" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="540.0" y="356" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">realtime</text>
<text x="540.0" y="378" font-size="13" text-anchor="middle" fill="#334155">Deployment</text>
<text x="540.0" y="397" font-size="13" text-anchor="middle" fill="#334155">KEDA 연결 수 기준</text>
<text x="540.0" y="416" font-size="13" text-anchor="middle" fill="#334155">축소 시 연결 정리</text>
<rect x="420" y="500" width="240" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="540.0" y="526" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">worker</text>
<text x="540.0" y="548" font-size="13" text-anchor="middle" fill="#334155">StatefulSet (오토스케일 X)</text>
<text x="540.0" y="567" font-size="13" text-anchor="middle" fill="#334155">순번 index 버킷 분배</text>
<text x="540.0" y="586" font-size="13" text-anchor="middle" fill="#334155">prepare, member,</text>
<text x="540.0" y="605" font-size="13" text-anchor="middle" fill="#334155">deadline, bridge</text>
<rect x="720" y="140" width="330" height="560" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="885" y="168" font-size="18" font-weight="700" text-anchor="middle" fill="#7f1d1d">Redis 역할 분리</text>
<rect x="740" y="185" width="290" height="105" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<text x="754" y="211" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">① Game  (이중화 필수)</text>
<text x="754" y="233" font-size="12" text-anchor="start" fill="#334155">그룹 Hash, 명단, Lua, Stream</text>
<text x="754" y="252" font-size="12" text-anchor="start" fill="#334155">Cluster {b} 샤딩 + replica</text>
<text x="754" y="271" font-size="12" text-anchor="start" fill="#334155">WAIT 1, Sentinel failover</text>
<rect x="740" y="300" width="290" height="90" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<text x="754" y="326" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">② Auth  (이중화 필수)</text>
<text x="754" y="348" font-size="12" text-anchor="start" fill="#334155">sess:{uid}, tk:{ticket}</text>
<text x="754" y="367" font-size="12" text-anchor="start" fill="#334155">primary + replica</text>
<rect x="740" y="400" width="290" height="110" rx="10" fill="#fff" stroke="#f87171" stroke-width="2"/>
<text x="754" y="426" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">③ Cache  (선택)</text>
<text x="754" y="448" font-size="12" text-anchor="start" fill="#334155">result:{gid}, bank:{uid}</text>
<text x="754" y="467" font-size="12" text-anchor="start" fill="#334155">bank:b{n} 저하 모드</text>
<text x="754" y="486" font-size="12" text-anchor="start" fill="#334155">문제 본문 Hash</text>
<rect x="740" y="520" width="290" height="90" rx="10" fill="#fff" stroke="#fca5a5" stroke-width="2"/>
<text x="754" y="546" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">④ PubSub  (낮음)</text>
<text x="754" y="568" font-size="12" text-anchor="start" fill="#334155">ch:{b}:gid 그룹 채널</text>
<text x="754" y="587" font-size="12" text-anchor="start" fill="#334155">죽어도 snapshot 복구</text>
<text x="755" y="640" font-size="12" fill="#991b1b">서킷 브레이커 = 빠른 실패 (503) 만</text>
<text x="755" y="660" font-size="12" fill="#991b1b">전환 결정 = Sentinel / Cluster</text>
<rect x="1110" y="150" width="330" height="110" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1275.0" y="176" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Kafka</text>
<text x="1275.0" y="198" font-size="13" text-anchor="middle" fill="#334155">topic: game-events</text>
<text x="1275.0" y="217" font-size="13" text-anchor="middle" fill="#334155">브리지 ← Redis Stream (outbox)</text>
<rect x="1110" y="310" width="150" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1185.0" y="336" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">persister</text>
<text x="1185.0" y="358" font-size="13" text-anchor="middle" fill="#334155">consumer group A</text>
<rect x="1290" y="310" width="150" height="90" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1365.0" y="336" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">OLAP 적재</text>
<text x="1365.0" y="358" font-size="13" text-anchor="middle" fill="#334155">consumer group B</text>
<rect x="1110" y="450" width="150" height="110" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="1185.0" y="476" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">PostgreSQL</text>
<text x="1185.0" y="498" font-size="13" text-anchor="middle" fill="#334155">관리형 (RDS)</text>
<text x="1185.0" y="517" font-size="13" text-anchor="middle" fill="#334155">읽기 replica</text>
<rect x="1290" y="450" width="150" height="110" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1365.0" y="476" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">OLAP 저장소</text>
<text x="1365.0" y="498" font-size="13" text-anchor="middle" fill="#334155">분석, 로그</text>
<rect x="1110" y="640" width="330" height="110" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="1275.0" y="666" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Prometheus + Grafana</text>
<text x="1275.0" y="688" font-size="13" text-anchor="middle" fill="#334155">신호 지연 p99, 거부 사유</text>
<text x="1275.0" y="707" font-size="13" text-anchor="middle" fill="#334155">Stream / Kafka lag, dead-letter</text>
<text x="1275.0" y="726" font-size="13" text-anchor="middle" fill="#334155">SSE 연결 수, bank miss 비율</text>
<rect x="240" y="760" width="820" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="650.0" y="786" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a"></text>
<text x="260" y="790" font-size="16" font-weight="700" fill="#0f172a">핵심 흐름</text>
<text x="260" y="818" font-size="14" fill="#334155">① 클라이언트 → ALB → api → Redis Game Lua (원자 판정)</text>
<text x="260" y="842" font-size="14" fill="#334155">② Lua → Stream XADD → worker 브리지 → Kafka → persister → PostgreSQL</text>
<text x="260" y="866" font-size="14" fill="#334155">③ api → PubSub SPUBLISH → realtime → SSE</text>
<text x="260" y="890" font-size="14" fill="#334155">④ Kafka → OLAP 적재 → 분석 / Prometheus 가 전 구간 지표 수집</text>
<text x="260" y="914" font-size="14" fill="#334155">⑤ 문제 본문 = CDN 또는 Redis Cache, api 힙엔 id 목록만</text>
