<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">동시 접속 그룹 미션 서버, 현재 구조 (로컬 docker compose)</text>
  <text x="40" y="76" font-size="15" fill="#64748b">2026-11-11 main 기준 실측 / iac/compose.yaml, backend/ 코드</text>

  <!-- compose 경계 -->
  <rect x="250" y="100" width="1000" height="630" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="270" y="126" font-size="14" fill="#64748b">docker compose (group-mission)</text>

  <!-- 클라이언트 -->
  <rect x="30" y="300" width="170" height="120" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="115" y="345" font-size="19" font-weight="700" text-anchor="middle" fill="#0f172a">클라이언트</text>
  <text x="115" y="370" font-size="14" text-anchor="middle" fill="#475569">앱 / 웹</text>
  <text x="115" y="392" font-size="13" text-anchor="middle" fill="#475569">로컬 스토리지</text>

  <!-- web -->
  <rect x="290" y="150" width="210" height="90" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="395" y="183" font-size="17" font-weight="700" text-anchor="middle" fill="#475569">web :3000</text>
  <text x="395" y="205" font-size="13" text-anchor="middle" fill="#64748b">데모 웹 (nginx)</text>
  <text x="395" y="224" font-size="13" text-anchor="middle" fill="#64748b">/api, /realtime 프록시</text>

  <!-- api -->
  <rect x="290" y="290" width="210" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="395" y="322" font-size="20" font-weight="700" text-anchor="middle" fill="#1e3a8a">api :8080</text>
  <text x="395" y="346" font-size="13" text-anchor="middle" fill="#1e40af">REST 14개 + 시각 이동 2개</text>
  <text x="395" y="366" font-size="13" text-anchor="middle" fill="#1e40af">인증 (JWT 쿠키)</text>
  <text x="395" y="386" font-size="13" text-anchor="middle" fill="#1e40af">신호 → Lua 1회</text>
  <text x="395" y="406" font-size="13" text-anchor="middle" fill="#1e40af">SSE 티켓 발급 (30초)</text>

  <!-- realtime -->
  <rect x="290" y="500" width="210" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="395" y="532" font-size="20" font-weight="700" text-anchor="middle" fill="#7c2d12">realtime :8081</text>
  <text x="395" y="556" font-size="13" text-anchor="middle" fill="#9a3412">SSE 연결 유지</text>
  <text x="395" y="576" font-size="13" text-anchor="middle" fill="#9a3412">그룹 채널 구독, 팬아웃</text>
  <text x="395" y="596" font-size="13" text-anchor="middle" fill="#9a3412">하트비트 15초</text>

  <!-- Redis -->
  <rect x="610" y="230" width="300" height="400" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="760" y="264" font-size="21" font-weight="700" text-anchor="middle" fill="#7f1d1d">Redis 8</text>
  <text x="760" y="286" font-size="13" text-anchor="middle" fill="#991b1b">AOF everysec (유실 최대 1초)</text>
  <g font-size="14" fill="#7f1d1d">
    <rect x="630" y="302" width="260" height="46" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="645" y="322" font-weight="700">그룹 Hash</text>
    <text x="645" y="340" font-size="12" fill="#991b1b">g:{b}:gid:date / 진행, 판정, 랭킹</text>
    <rect x="630" y="356" width="260" height="46" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="645" y="376" font-weight="700">Lua 스크립트</text>
    <text x="645" y="394" font-size="12" fill="#991b1b">start, shown, solve, pass, fail, deadline 등</text>
    <rect x="630" y="410" width="260" height="46" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="645" y="430" font-weight="700">Stream ev:{b}</text>
    <text x="645" y="448" font-size="12" fill="#991b1b">버킷 1,024개 / outbox</text>
    <rect x="630" y="464" width="260" height="46" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="645" y="484" font-weight="700">Sharded Pub/Sub</text>
    <text x="645" y="502" font-size="12" fill="#991b1b">ch:{b}:gid / 그룹 채널</text>
    <rect x="630" y="518" width="260" height="96" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="645" y="538" font-weight="700">그 밖의 키</text>
    <text x="645" y="558" font-size="12" fill="#991b1b">bank:{uid}:date  문제은행</text>
    <text x="645" y="576" font-size="12" fill="#991b1b">result:{gid}  결과 캐시</text>
    <text x="645" y="594" font-size="12" fill="#991b1b">tk:{ticket}, sess:{uid}  티켓, 세션</text>
  </g>

  <!-- worker -->
  <rect x="990" y="150" width="240" height="250" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1110" y="182" font-size="20" font-weight="700" text-anchor="middle" fill="#14532d">worker (포트 없음)</text>
  <g font-size="13" fill="#166534">
    <text x="1008" y="214" font-weight="700">prepare-questions</text>
    <text x="1008" y="232">06:30, 06:50 문제은행 미리 생성</text>
    <text x="1008" y="262" font-weight="700">member</text>
    <text x="1008" y="280">07:00 명단 확정, 일 파티션</text>
    <text x="1008" y="310" font-weight="700">deadline</text>
    <text x="1008" y="328">08:00 마감 / 08:00:03 랭킹 확정</text>
    <text x="1008" y="358" font-weight="700">persister</text>
    <text x="1008" y="376">Stream → PG, 3회 실패 dead-letter</text>
  </g>

  <!-- PostgreSQL -->
  <rect x="990" y="480" width="240" height="200" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="1110" y="512" font-size="20" font-weight="700" text-anchor="middle" fill="#312e81">PostgreSQL 18</text>
  <text x="1110" y="534" font-size="13" text-anchor="middle" fill="#3730a3">정본 / 재적재 원천</text>
  <g font-size="12" fill="#3730a3">
    <text x="1008" y="562">groups, users, questions</text>
    <text x="1008" y="582">served_questions</text>
    <text x="1008" y="602">daily_progress (일 파티션)</text>
    <text x="1008" y="622">solve_signals</text>
    <text x="1008" y="642">group_results, group_result_members</text>
    <text x="1008" y="662">persister_dead_letters</text>
  </g>

  <!-- 화살표: 클라이언트 → api / realtime / web -->
  <path d="M200 340 L288 350" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <text x="208" y="330" font-size="13" fill="#1d4ed8" font-weight="700">① REST</text>
  <path d="M288 560 L180 422" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#ao)"/>
  <text x="166" y="500" font-size="13" fill="#c2410c" font-weight="700">⑤ SSE push</text>
  <path d="M170 300 L288 205" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="170" y="245" font-size="12" fill="#64748b">데모 웹만</text>

  <!-- api → Redis -->
  <path d="M500 345 L608 345" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <text x="510" y="333" font-size="13" fill="#1d4ed8" font-weight="700">② EVALSHA</text>
  <text x="510" y="365" font-size="12" fill="#1d4ed8">순서, 멱등, 마감,</text>
  <text x="510" y="381" font-size="12" fill="#1d4ed8">판정 원자 처리</text>

  <!-- Redis → realtime -->
  <path d="M628 488 Q560 520 502 555" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#ao)"/>
  <text x="508" y="470" font-size="13" fill="#c2410c" font-weight="700">③ SPUBLISH</text>
  <text x="508" y="488" font-size="12" fill="#c2410c">그룹 채널 구독</text>

  <!-- Redis → worker (Stream) -->
  <path d="M890 432 Q950 400 988 360" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <text x="916" y="472" font-size="13" fill="#15803d" font-weight="700">④ XREADGROUP</text>

  <!-- worker → PG -->
  <path d="M1110 400 L1110 478" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <text x="1120" y="445" font-size="12" fill="#15803d">멱등 upsert, XACK</text>

  <!-- worker → Redis (잡) -->
  <path d="M988 230 Q940 250 912 300" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ag)"/>
  <text x="918" y="200" font-size="11" fill="#15803d">잡 Lua</text>
  <text x="918" y="215" font-size="11" fill="#15803d">명단, 마감</text>

  <!-- api → PG -->
  <path d="M500 420 L598 420 L598 705 L1110 705 L1110 684" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="640" y="698" font-size="12" fill="#475569">api → PG: 가입, 로그인, 결과 조회, 재적재 (R2DBC)</text>
</svg>
